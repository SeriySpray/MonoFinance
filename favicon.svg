<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SwiftFinance logo</title>
  <desc id="desc">Ícone vetorial de um pássaro estilizado SwiftFinance dentro de um quadrado arredondado verde.</desc>
  <defs>
