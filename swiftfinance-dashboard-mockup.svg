<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">SwiftFinance Dashboard Mockup</title>
  <desc id="desc">Mockup de um dashboard financeiro SwiftFinance com saldo, cash flow, despesas por categoria, transações recentes e objetivos.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22c58b"/><stop offset="1" stop-color="#0b8c68"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#18a678" stop-opacity=".30"/><stop offset="1" stop-color="#18a678" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071014" flood-opacity=".28"/>
    </filter>
    <style>
      .font{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#91a7aa}.white{fill:#f3fbf7}.green{fill:#35d19b}.label{font-size:14px}.small{font-size:12px}.medium{font-size:16px}.title{font-size:26px;font-weight:700}.bold{font-weight:700}.semibold{font-weight:600}.card{fill:#112127;stroke:#20363b;stroke-width:1}.line{stroke:#294147;stroke-width:1}.nav{fill:#b2c2c3;font-size:14px}.navActive{fill:#fff;font-weight:700}.icon{fill:none;stroke:#93aaac;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#081317"/>
  <rect x="0" y="0" width="250" height="1000" fill="#0d1c21"/>
  <line x1="250" y1="0" x2="250" y2="1000" stroke="#20363b"/>

  <!-- Brand -->
  <g transform="translate(35 34)">
    <circle cx="22" cy="22" r="22" fill="url(#brand)"/>
    <path d="M12 27c6-3 8-10 9-17 5 6 10 10 12 17-6-3-12-3-21 0Z" fill="#fff" opacity=".94"/>
    <text x="56" y="29" class="font white" font-size="23" font-weight="800">Swift<tspan fill="#35d19b">Finance</tspan></text>
  </g>

  <!-- Sidebar -->
  <text x="35" y="132" class="font muted small" letter-spacing="1.5">WORKSPACE</text>
  <g transform="translate(30 156)">
    <rect width="190" height="48" rx="12" fill="#15382f"/>
    <path d="M18 17h14v14H18z M21 20h8 M21 24h8 M21 28h5" class="icon" stroke="#35d19b"/>
    <text x="50" y="30" class="font white medium semibold">Overview</text>
  </g>
  <g class="font nav">
    <path d="M50 232h18 M50 238h18 M50 244h18" class="icon"/><text x="87" y="242">Transactions</text>
    <path d="M50 286h18v15H50z M53 282v4 M65 282v4" class="icon"/><text x="87" y="298">Budgets</text>
    <circle cx="59" cy="351" r="10" class="icon"/><path d="M59 345v12 M53 351h12" class="icon"/><text x="87" y="357">Goals</text>
    <path d="M50 403v-15 M59 403v-23 M68 403v-31" class="icon"/><text x="87" y="405">Reports</text>
  </g>
  <text x="35" y="476" class="font muted small" letter-spacing="1.5">PREFERENCES</text>
  <g class="font nav">
    <circle cx="59" cy="522" r="8" class="icon"/><path d="M59 508v5m0 18v5m-14-14h5m18 0h5m-14-14 3 4m10 10 3 4m-17-18-3 4m17 10-3 4" class="icon"/><text x="87" y="528">Settings</text>
    <path d="M50 582h18v13H50z M54 578h10" class="icon"/><text x="87" y="594">Help center</text>
  </g>
  <rect x="30" y="842" width="190" height="112" rx="16" fill="#122c28" stroke="#1f5143"/>
  <circle cx="56" cy="873" r="17" fill="#1e8066"/><path d="M49 874c4-5 7-6 14-7-2 7-5 10-10 12" fill="none" stroke="#b9ffe5" stroke-width="2"/>
  <text x="84" y="871" class="font white small semibold">Upgrade plan</text>
  <text x="48" y="906" class="font muted small">Unlock advanced insights</text>
  <rect x="48" y="921" width="124" height="8" rx="4" fill="#285046"/><rect x="48" y="921" width="74" height="8" rx="4" fill="#35d19b"/>

  <!-- Top bar -->
  <text x="292" y="62" class="font white title">Good morning, Alex</text>
  <text x="292" y="90" class="font muted label">Here’s your financial overview for September 2026.</text>
  <g transform="translate(1120 34)">
    <rect width="164" height="44" rx="12" fill="#112127" stroke="#294147"/>
    <circle cx="25" cy="22" r="9" class="icon"/><path d="m32 29 7 7" class="icon"/>
    <text x="49" y="27" class="font muted small">Search</text>
  </g>
  <circle cx="1325" cy="55" r="19" fill="#1a8065"/><text x="1316" y="61" class="font white bold">AM</text>
  <circle cx="1295" cy="42" r="5" fill="#35d19b"/>

  <!-- Main content -->
  <g transform="translate(292 132)">
    <!-- KPI cards -->
    <g class="card" filter="url(#shadow)">
      <rect width="250" height="142" rx="18"/><text x="22" y="34" class="font muted label">Total balance</text><text x="22" y="78" class="font white" font-size="30" font-weight="750">€24,680.40</text><text x="22" y="113" class="font green small">↗ 12.8%</text><text x="78" y="113" class="font muted small">vs last month</text>
      <circle cx="215" cy="34" r="18" fill="#183b32"/><path d="M207 34h16m-8-8v16" class="icon" stroke="#35d19b"/>
    </g>
    <g transform="translate(268 0)" class="card"><rect width="250" height="142" rx="18"/><text x="22" y="34" class="font muted label">Monthly income</text><text x="22" y="78" class="font white" font-size="30" font-weight="750">€5,840.00</text><text x="22" y="113" class="font green small">↗ 4.2%</text><text x="78" y="113" class="font muted small">vs last month</text><circle cx="215" cy="34" r="18" fill="#183b32"/><path d="M207 39c4-9 9-9 16-2" class="icon" stroke="#35d19b"/></g>
    <g transform="translate(536 0)" class="card"><rect width="250" height="142" rx="18"/><text x="22" y="34" class="font muted label">Monthly expenses</text><text x="22" y="78" class="font white" font-size="30" font-weight="750">€3,268.75</text><text x="22" y="113" class="font green small">↓ 8.6%</text><text x="78" y="113" class="font muted small">vs last month</text><circle cx="215" cy="34" r="18" fill="#3b2929"/><path d="M207 29c4 9 9 9 16 2" class="icon" stroke="#ff8c8c"/></g>
    <g transform="translate(804 0)" class="card"><rect width="250" height="142" rx="18"/><text x="22" y="34" class="font muted label">Savings rate</text><text x="22" y="78" class="font white" font-size="30" font-weight="750">44.0%</text><text x="22" y="113" class="font green small">↗ 6.1%</text><text x="78" y="113" class="font muted small">vs last month</text><circle cx="215" cy="34" r="18" fill="#183b32"/><path d="M207 38h16M207 31h16M207 45h16" class="icon" stroke="#35d19b"/></g>

    <!-- Cash flow -->
    <g transform="translate(0 166)" class="card"><rect width="786" height="360" rx="18"/><text x="24" y="38" class="font white" font-size="18" font-weight="700">Cash flow</text><text x="24" y="62" class="font muted small">Income and expenses over time</text><rect x="622" y="20" width="136" height="34" rx="9" fill="#172d32" stroke="#294147"/><text x="642" y="42" class="font muted small">Last 6 months　⌄</text>
      <line x1="68" y1="112" x2="748" y2="112" class="line"/><line x1="68" y1="170" x2="748" y2="170" class="line"/><line x1="68" y1="228" x2="748" y2="228" class="line"/><line x1="68" y1="286" x2="748" y2="286" class="line"/>
      <text x="24" y="117" class="font muted small">€8k</text><text x="24" y="175" class="font muted small">€6k</text><text x="24" y="233" class="font muted small">€4k</text><text x="24" y="291" class="font muted small">€2k</text>
      <path d="M68 188 C135 160 150 190 205 148 S275 168 324 127 S390 144 442 112 S510 144 557 120 S625 139 680 98 S720 110 748 84 L748 286 L68 286 Z" fill="url(#chartFill)"/>
      <path d="M68 188 C135 160 150 190 205 148 S275 168 324 127 S390 144 442 112 S510 144 557 120 S625 139 680 98 S720 110 748 84" fill="none" stroke="#35d19b" stroke-width="3"/>
      <path d="M68 240 C135 225 160 244 205 214 S275 235 324 201 S390 219 442 190 S510 218 557 199 S625 220 680 172 S720 195 748 165" fill="none" stroke="#718d91" stroke-width="2" stroke-dasharray="6 6"/>
      <g class="font muted small"><text x="68" y="320">Apr</text><text x="198" y="320">May</text><text x="326" y="320">Jun</text><text x="454" y="320">Jul</text><text x="582" y="320">Aug</text><text x="716" y="320">Sep</text></g>
      <circle cx="730" cy="98" r="5" fill="#35d19b" stroke="#112127" stroke-width="3"/><rect x="615" y="73" width="106" height="32" rx="8" fill="#f3fbf7"/><text x="628" y="94" class="font" font-size="12" fill="#102126">€7,420 income</text>
    </g>

    <!-- Spending by category -->
    <g transform="translate(804 166)" class="card"><rect width="250" height="360" rx="18"/><text x="22" y="38" class="font white" font-size="18" font-weight="700">Spending</text><text x="22" y="62" class="font muted small">By category this month</text>
      <circle cx="125" cy="157" r="72" fill="none" stroke="#20383e" stroke-width="24"/><path d="M125 85a72 72 0 0 1 65 103" fill="none" stroke="#35d19b" stroke-width="24"/><path d="M190 188a72 72 0 0 1-101 25" fill="none" stroke="#6b83ff" stroke-width="24"/><path d="M89 213a72 72 0 0 1-29-82" fill="none" stroke="#f0b45c" stroke-width="24"/><path d="M60 131a72 72 0 0 1 65-46" fill="none" stroke="#d77bdf" stroke-width="24"/>
      <text x="100" y="153" class="font white" font-size="20" font-weight="750">€3,268</text><text x="101" y="174" class="font muted small">total spent</text>
      <circle cx="30" cy="263" r="5" fill="#35d19b"/><text x="44" y="267" class="font muted small">Housing</text><text x="188" y="267" class="font white small">32%</text>
      <circle cx="30" cy="289" r="5" fill="#6b83ff"/><text x="44" y="293" class="font muted small">Food</text><text x="188" y="293" class="font white small">24%</text>
      <circle cx="30" cy="315" r="5" fill="#f0b45c"/><text x="44" y="319" class="font muted small">Transport</text><text x="188" y="319" class="font white small">18%</text>
      <circle cx="30" cy="341" r="5" fill="#d77bdf"/><text x="44" y="345" class="font muted small">Other</text><text x="188" y="345" class="font white small">26%</text>
    </g>

    <!-- Bottom cards -->
    <g transform="translate(0 550)" class="card"><rect width="786" height="280" rx="18"/><text x="24" y="38" class="font white" font-size="18" font-weight="700">Recent transactions</text><text x="24" y="62" class="font muted small">Your latest account activity</text><text x="704" y="42" class="font green small">View all　→</text><line x1="24" y1="84" x2="762" y2="84" class="line"/>
      <g class="font muted small"><text x="24" y="111">DESCRIPTION</text><text x="434" y="111">DATE</text><text x="578" y="111">STATUS</text><text x="690" y="111">AMOUNT</text></g>
      <g class="font white medium"><circle cx="44" cy="145" r="17" fill="#203d36"/><text x="38" y="151" fill="#35d19b">S</text><text x="76" y="151">Salary payment</text><text x="434" y="151" class="muted small">Sep 01, 2026</text><rect x="578" y="132" width="65" height="25" rx="12" fill="#193c31"/><text x="590" y="149" fill="#35d19b" class="small">Received</text><text x="690" y="151" fill="#35d19b">+€4,800</text>
      <line x1="24" y1="174" x2="762" y2="174" class="line"/><circle cx="44" cy="205" r="17" fill="#29304b"/><text x="37" y="211" fill="#a8b4ff">N</text><text x="76" y="211">Nova Market</text><text x="434" y="211" class="muted small">Sep 03, 2026</text><rect x="578" y="192" width="65" height="25" rx="12" fill="#26313a"/><text x="589" y="209" class="muted small">Cleared</text><text x="690" y="211">−€86.40</text>
      <line x1="24" y1="234" x2="762" y2="234" class="line"/><circle cx="44" cy="265" r="17" fill="#473b29"/><text x="37" y="271" fill="#f0b45c">T</text><text x="76" y="271">Transit pass</text><text x="434" y="271" class="muted small">Sep 04, 2026</text><rect x="578" y="252" width="65" height="25" rx="12" fill="#26313a"/><text x="589" y="269" class="muted small">Cleared</text><text x="690" y="271">−€42.00</text></g>
    </g>
    <g transform="translate(804 550)" class="card"><rect width="250" height="280" rx="18"/><text x="22" y="38" class="font white" font-size="18" font-weight="700">Savings goal</text><text x="22" y="62" class="font muted small">Holiday fund</text><circle cx="125" cy="142" r="62" fill="none" stroke="#20383e" stroke-width="13"/><path d="M125 80a62 62 0 0 1 57 87" fill="none" stroke="#35d19b" stroke-width="13" stroke-linecap="round"/><text x="94" y="143" class="font white" font-size="24" font-weight="750">72%</text><text x="99" y="165" class="font muted small">complete</text><text x="22" y="236" class="font white medium semibold">€3,600 <tspan class="muted small">of €5,000</tspan></text><rect x="22" y="251" width="206" height="7" rx="4" fill="#20383e"/><rect x="22" y="251" width="148" height="7" rx="4" fill="#35d19b"/></g>
  </g>
</svg>